name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same image and command as `make test`, so CI runs the production Python version.
      - name: Build backend image
        run: docker compose build backend
      - name: Run pytest
        run: docker compose run --rm --no-deps backend env -u CAROTID_DICOM_ROOT -u CAROTID_PROJECTS_ROOT python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
