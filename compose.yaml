name: carotid
services:
  backend:
    build: .
    init: true
    environment:
      CAROTID_DICOM_ROOT: /data/dicom
      CAROTID_PROJECTS_ROOT: /data/projects
      CAROTID_AUTOSEED_WORKER_URL: ${CAROTID_AUTOSEED_WORKER_URL:-http://host.docker.internal:8011/segment}
    volumes:
      - ${DICOM_DIR:-./data/dicom}:/data/dicom:ro
      - ${PROJECTS_DIR:-./data/projects}:/data/projects
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    stop_grace_period: 20s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
